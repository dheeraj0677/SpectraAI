[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: Fast isolated unit tests with no external calls or persistent DB
    integration: Integration tests with SQLite database operations
    api: FastAPI endpoint request/response and error handling tests
    e2e: End-to-end multimodal pipeline and human review lifecycle tests
    frontend: Frontend component and export validation tests
filterwarnings =
    error::DeprecationWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
