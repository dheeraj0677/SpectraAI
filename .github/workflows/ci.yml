name: CI

on:
  push:
    branches: [ main, master, 'improvement/**', 'feature/**' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Python Verification (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies via uv
        run: uv pip install --system -r backend/requirements.txt

      - name: Verify zero deprecation warnings on module imports
        run: |
          python -W error::DeprecationWarning -c "import backend.models, backend.main, backend.pipeline, backend.extract, backend.merge, backend.enrich, backend.knowledge_graph, backend.validate, backend.database, backend.human_review, backend.ingest, backend.normalize, backend.config, backend.telemetry; print('All backend modules clean!')"

  backend-tests:
    name: Backend Pytest & Compatibility Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies via uv
        run: uv pip install --system -r backend/requirements.txt pytest pytest-asyncio httpx reportlab pillow

      - name: Run Pytest suite
        run: |
          mkdir -p reports
          pytest -v --junitxml=reports/pytest-report.xml

      - name: Run compatibility test suite
        run: python test_e2e.py

      - name: Run deterministic benchmark
        run: python benchmark_pipeline.py --iterations 3

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            test_report.json
            reports/
          retention-days: 14

  frontend-build-and-test:
    name: Frontend Smoke Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Enable Corepack & install dependencies
        run: |
          corepack enable
          npm --prefix frontend ci

      - name: Run frontend smoke tests
        run: npm --prefix frontend test

      - name: Run Vite production build
        run: npm --prefix frontend run build

  demo-smoke:
    name: Offline Demo & Health Check Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install backend dependencies
        run: uv pip install --system -r backend/requirements.txt

      - name: Start FastAPI server
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          sleep 4

      - name: Verify health check endpoint
        run: |
          curl -s --fail http://127.0.0.1:8000/api/health | grep -q '"status":"healthy"'
          echo "Health check passed!"

      - name: Verify diagnostics endpoint
        run: |
          curl -s --fail http://127.0.0.1:8000/api/diagnostics | grep -q '"uptime_seconds"'
          echo "Diagnostics endpoint passed!"

      - name: Trigger sample batch demo
        run: |
          RESPONSE=$(curl -s -X POST http://127.0.0.1:8000/api/demo/load-sample)
          echo "$RESPONSE" | grep -q '"status":"started"'
          echo "Sample demo run triggered successfully!"
