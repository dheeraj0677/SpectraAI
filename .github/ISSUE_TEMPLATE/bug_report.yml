name: Bug Report
description: Report a bug, broken feature, or unexpected error.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please provide as much detail as possible to help us reproduce and fix it.
  - type: textarea
    id: problem-description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this issue locally?
      placeholder: |
        1. Start backend `python main.py`
        2. Upload `sample.pdf`
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs-and-screenshots
    attributes:
      label: Error Logs or Screenshots
      description: Paste relevant terminal traceback or drag-and-drop screenshots.
      render: shell
  - type: dropdown
    id: environment
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
